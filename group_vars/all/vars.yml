progetto_docker: "progetto"
destinazione: "/opt"
modalita_developer: false # true: ricostruisce sempre l'immagine e ricrea i container, false: segue la policy del container.
package_update: false

utility_sistema_comuni:
  - curl
  - htop
  - ufw

# Pacchetti APT nativi per Ubuntu 24.04 LTS necessari a far girare Docker e Ansible Docker Modules
pacchetti_app:
  - git
  - docker.io
  - docker-compose-v2
  - docker-buildx
  - python3-pip
  - python3-docker
  - python3-setuptools

pacchetti_db:
  - docker.io
  - python3-docker

db_conn:
  host: "{{ lookup('env', 'DB_HOST') }}"
  port: 3306
  name: "progetto"
  user: "user_progetto"
  volume_path: "{{ lookup('env', 'DB_VOLUME_PATH') }}"
  pass: "{{ vault_db_password }}"
  root_pass: "{{ vault_db_root_password }}"
  destroy_volume: "{{ lookup('env', 'DB_DESTROY_VOLUME') | default('false', true) }}" # Imposta a true  per rimuovere fisicamente i dati all'avvio del cleanup

lb_config:
  # --- parametri dell'app (menu): restano da .env, cambieranno col rifacimento ---
  frontend_port: "{{ lookup('env', 'LB_FRONTEND_PORT') }}"
  stats_port: "{{ lookup('env', 'LB_STATS_PORT') }}"
  check_path: "{{ lookup('env', 'LB_CHECK_PATH') }}"
  # --- tuning HAProxy infrastrutturale: stabile, valori diretti ---
  stats_uri: /stats
  maxconn: 20000
  timeout_connect: 5000
  timeout_client: 50000
  timeout_server: 50000
  algorithm: roundrobin
  force_config: false # imposta a false per evitare la rigenerazione della configurazione ad ogni esecuzione,
   # se il file esiste non verrà sovrascritto. attenzione! se i parametri all'interno variano questi non verranno applicati!

app_config:
  git_repo: "https://{{ vault_git_token }}@{{ lookup('env', 'GIT_REPO') }}"
  git_version: "{{ lookup('env', 'GIT_VERSION') | default('main', true) }}"
  port: "{{ lookup('env', 'APP_CONFIG_PORT') | default('8000', true) }}"

haproxy_markers:
  fastapi: "ANSIBLE MANAGED BLOCK: progetto_fastapi"
  mysql_monitor: "ANSIBLE MANAGED BLOCK: mysql_monitor"
