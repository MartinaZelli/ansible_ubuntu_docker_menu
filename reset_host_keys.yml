---
- name: "Pulisci le host key obsolete dal known_hosts locale"
  hosts: "{{ target | default('menu_stack') }}"
  gather_facts: false
  connection: local
  tasks:
    - name: "Rimuovi la host key per IP da known_hosts"
      ansible.builtin.known_hosts:
        name: "{{ ansible_host }}"
        state: absent
      delegate_to: localhost

    - name: "Rimuovi la host key per hostname FQDN da known_hosts"
      ansible.builtin.known_hosts:
        name: "{{ inventory_hostname }}.{{ ad_domain | default('ad.lab.home') }}"
        state: absent
      delegate_to: localhost
      when: inventory_hostname in groups.get('ad_clients', [])
