---
- name: Stop sssd
  listen: Reset SSSD cache
  ansible.builtin.systemd_service:
    name: sssd
    state: stopped

- name: Remove sssd cache files
  listen: Reset SSSD cache
  ansible.builtin.file:
    path: /var/lib/sss/db
    state: absent

- name: Start sssd
  listen: Reset SSSD cache
  ansible.builtin.systemd_service:
    name: sssd
    state: started
