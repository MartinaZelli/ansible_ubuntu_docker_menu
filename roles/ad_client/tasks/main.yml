---

# per questa configurazione sono obbligata ad usare command (che evito se possibile). introduco però registrer e changed_when per idempotenza.
###
- name: Preconfigura il realm Kerberos di default (debconf)
  ansible.builtin.debconf:
    name: krb5-config
    question: krb5-config/default_realm
    value: "{{ ad_client_realm }}"
    vtype: string

- name: Installa lo stack del client AD
  ansible.builtin.apt:
    name: "{{ ad_client_packages }}"
    state: present
    update_cache: true

- name: Verifica che il dominio sia raggiungibile (discovery DNS) # precheck. se il dns non vede il DC fallisce qui.
  ansible.builtin.command: realm discover {{ ad_client_domain }}
  register: ad_client_discover
  changed_when: false

- name: Controlla se l'host è già membro del dominio
  ansible.builtin.command: realm list
  register: ad_client_realm_list
  changed_when: false

- name: Unisci l'host al dominio AD
  ansible.builtin.command:
    cmd: realm join --user={{ ad_client_join_user }} {{ ad_client_domain }}
    stdin: "{{ ad_client_join_password }}"
  no_log: true # impostato per non mostrare in chiaro la password, se il join fallisce impostarlo su false per debug
  when: ad_client_domain not in ad_client_realm_list.stdout
  changed_when: true

- name: Imposta la politica di ID mapping in sssd.conf
  ansible.builtin.lineinfile:
    path: /etc/sssd/sssd.conf
    regexp: '^\s*ldap_id_mapping\s*='
    line: "ldap_id_mapping = {{ ad_client_id_mapping }}"
    insertafter: '^\[domain/{{ ad_client_domain }}\]'
    state: present
  notify: Reset SSSD cache

- name: Controlla se mkhomedir è già abilitato
  ansible.builtin.command: grep -q pam_mkhomedir /etc/pam.d/common-session
  register: ad_client_mkhomedir
  changed_when: false
  failed_when: false

- name: Abilita la creazione automatica delle home directory
  ansible.builtin.command: pam-auth-update --enable mkhomedir
  when: ad_client_mkhomedir.rc != 0
  changed_when: true

- name: Rileggi lo stato del realm
  ansible.builtin.command: realm list
  register: ad_client_realm_state
  changed_when: false

- name: Restringi il login al solo gruppo {{ ad_client_allowed_group }}
  ansible.builtin.command: realm permit -g {{ ad_client_allowed_group }}@{{ ad_client_domain }}
  when: (ad_client_allowed_group ~ '@' ~ ad_client_domain) not in ad_client_realm_state.stdout
  changed_when: true

- name: Abilita il login AD via SSH per il gruppo autorizzato
      # Login AD: solo il gruppo {{ ad_client_ssh_login_group }} si autentica con password di dominio.
      # Gestito da Ansible (ruolo ad_client).
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/70-ad-login.conf
    content: |
      Match Group {{ ad_client_ssh_login_group }}
          PasswordAuthentication yes
          KbdInteractiveAuthentication yes
    owner: root
    group: root
    mode: "0644"
    # validate: verifica sul file temporaneo se la config è rotta e non la applica se non funziona.
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh
  when: ad_client_ssh_login_group | length > 0

- name: Rimuovi il login AD via SSH dove non previsto
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/70-ad-login.conf
    state: absent
  notify: Reload ssh
  when: ad_client_ssh_login_group | length == 0

- name: Registra il plugin localauth di SSSD in krb5.conf
  ansible.builtin.blockinfile:
    path: /etc/krb5.conf
    marker: "# {mark} ANSIBLE MANAGED - localauth"
    block: |
      [plugins]
          localauth = {
              module = sssd:{{ ad_client_sssd_localauth_plugin }}
          }
  when: ad_client_gssapi_enabled

- name: Abilita GSSAPI nel server SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/80-gssapi.conf
    content: |
      # Autenticazione Kerberos/GSSAPI: accetta il single sign-on dal bastion.
      # Gestito da Ansible (ruolo ad_client).
      GSSAPIAuthentication yes
      GSSAPICleanupCredentials yes
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh
  when: ad_client_gssapi_enabled

- name: Rimuovi la config GSSAPI dove non prevista
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/80-gssapi.conf
    state: absent
  notify: Reload ssh
  when: not ad_client_gssapi_enabled
