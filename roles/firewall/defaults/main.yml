---
# IP del bastion: l'unica fonte SSH permessa a regime
firewall_bastion_ip: 192.168.1.78
# Paracadute SSH temporaneo: consente l'accesso da un IP amministrativo (il tuo PC)
# OLTRE al bastion. DISATTIVATO di default ("" => nessun paracadute): a regime si
# entra SOLO dal bastion.
# Per attivarlo su una singola esecuzione rischiosa, valorizzalo al lancio:
#     -e firewall_admin_ip=192.168.1.23
# e poi, quando non serve piu', rimuovilo con:
#     -e firewall_admin_ip=192.168.1.23 -e firewall_lockdown=true
firewall_admin_ip: ""
# Porte SSH
firewall_ssh_port: 22

# Porte di servizio extra dichiarate dal singolo nodo (in host_vars/group_vars).
# Default vuoto: un nodo che non dichiara nulla riceve solo la policy base +
# SSH dal bastion, senza far esplodere il loop del ruolo.
firewall_service_rules: []
