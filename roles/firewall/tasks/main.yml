---
- name: Installa ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Politica di default - nega tutto in ingresso
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Politica di default - permetti tutto in uscita
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Permetti SSH dal bastion
  community.general.ufw:
    rule: allow
    from_ip: "{{ firewall_bastion_ip }}"
    port: "{{ firewall_ssh_port }}"
    proto: tcp

- name: Permetti SSH dall'IP di amministrazione (paracadute Tempo 1)
  community.general.ufw:
    rule: allow
    from_ip: "{{ firewall_admin_ip }}"
    port: "{{ firewall_ssh_port }}"
    proto: tcp
  when: firewall_admin_ip | length > 0

- name: Rimuovi il paracadute admin (Tempo 2 - lockdown)
  community.general.ufw:
    rule: allow
    from_ip: "{{ firewall_admin_ip }}"
    port: "{{ firewall_ssh_port }}"
    proto: tcp
    delete: true
  when: firewall_lockdown | default(false) and firewall_admin_ip | length > 0

- name: Apri le porte di servizio dichiarate dal nodo
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.from_ip | default('any') }}"
  loop: "{{ firewall_service_rules }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto }} da {{ item.from_ip | default('any') }}"

- name: Abilita ufw
  community.general.ufw:
    state: enabled
